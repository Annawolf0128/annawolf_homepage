<main class="content slides-content">
  <a class="slides-back" href="resources.html">← Back to Resources</a>
  <h1>Presentation Slides</h1>
  <section id="slides-gate" aria-labelledby="gate-heading">
    <h2 id="gate-heading">Welcome</h2>
    <p>Enter the password to browse presentation slides.</p>
    <form id="slides-form">
      <label for="slides-password">Password</label>
      <div class="slides-password-row">
        <input id="slides-password" name="password" type="password" autocomplete="current-password" required aria-describedby="slides-status" disabled>
        <button class="button primary" type="submit" disabled>Unlock slides <span aria-hidden="true">→</span></button>
      </div>
      <p id="slides-status" class="slides-status" role="status" aria-live="polite"></p>
    </form>
    <noscript><p>Please enable JavaScript to unlock the slides.</p></noscript>
  </section>
  <section id="slides-library" aria-labelledby="library-heading" hidden>
    <div class="slides-library-header">
      <h2 id="library-heading" tabindex="-1">Slide collection</h2>
      <button id="slides-lock" class="button secondary" type="button">Lock slides</button>
    </div>
    <div id="slides-list"></div>
    <p id="slides-empty" hidden>No slides have been added yet. Please check back soon.</p>
  </section>
</main>
</body>
